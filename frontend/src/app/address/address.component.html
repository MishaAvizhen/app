<div class="search-container">
    <h2 class="search-title">График работ</h2>

    <div class="search-bar">

        <!-- Поле: Город -->
        <div class="input-group">
            <label class="input-label">Город</label>
            <div class="input-wrapper">
                <input [ngModel]="city"
                       (ngModelChange)="onCityInput($event)"
                       (focus)="onCityInput(city)"
                       placeholder="Например, Минск"
                       (change)="onSearch(0)">

                <!-- Кнопка очистки для Города -->
                <button *ngIf="city" class="clear-btn" (click)="clearCity()">✕</button>

                <ul class="suggestions-list" *ngIf="citySuggestions.length > 0">
                    <li *ngFor="let res of citySuggestions" (click)="selectCity(res)">
                        <span class="geo-icon">📍</span> {{ res }}
                    </li>
                </ul>
            </div>
        </div>

        <!-- Поле: Улица -->
        <div class="input-group">
            <label class="input-label">Улица</label>
            <div class="input-wrapper">
                <input [ngModel]="street"
                       (ngModelChange)="onStreetInput($event)"
                       (focus)="onStreetInput(street)"
                       placeholder="Например, Ленина"
                       (change)="onSearch(0)">

                <!-- Кнопка очистки для Улицы -->
                <button *ngIf="street" class="clear-btn" (click)="clearStreet()">✕</button>

                <ul class="suggestions-list" *ngIf="streetSuggestions.length > 0">
                    <li *ngFor="let res of streetSuggestions" (click)="selectStreet(res)">
                        <span class="geo-icon">🛣️</span> {{ res }}
                    </li>
                </ul>
            </div>
        </div>

        <!-- Поле: Дом -->
        <div class="input-group house-group">
            <label class="input-label">Дом</label>
            <div class="input-wrapper">
                <input [(ngModel)]="houseNumber"
                       placeholder="10"
                       (input)="onSearch(0)">
                <!-- Кнопка очистки для Дома (по желанию) -->
                <button *ngIf="houseNumber" class="clear-btn" (click)="houseNumber=''; onSearch(0)">✕</button>
            </div>
        </div>

    </div>

    <!-- Блок результатов -->
    <div class="results-container">
        <div class="results-header" *ngIf="results.length > 0">
            Найдено адресов: {{ results.length }}
        </div>
        <div class="no-results" *ngIf="results.length === 0">
            Ничего не найдено. Начните вводить адрес для поиска.
        </div>
        <ul class="results-list" *ngIf="results.length > 0">
            <li *ngFor="let addr of results" class="results-item">
                <div class="address-card">
                    <div class="address-main">
                        <span class="address-marker">🏠</span>
                        <span class="address-text">
                        <strong>{{ addr.city }}</strong>, ул. {{ addr.street }}, д. {{ addr.houseNumber }}
                    </span>
                    </div>

                    <!-- Блок графика работы -->
                    <div class="work-schedule" *ngIf="addr.schedule">
                        <span class="schedule-icon">🕒</span>
                        <span class="schedule-text">{{ addr.schedule }}</span>
                    </div>
                </div>
            </li>
        </ul>
    </div>

    <!-- Блок пагинации (без изменений) -->
    <div class="pagination" *ngIf="totalPages > 1">
        <button class="page-btn" [disabled]="currentPage === 0" (click)="onSearch(currentPage - 1)">← Назад</button>
        <span class="page-info">Страница <strong>{{ currentPage + 1 }}</strong> из {{ totalPages }}</span>
        <button class="page-btn" [disabled]="currentPage >= totalPages - 1" (click)="onSearch(currentPage + 1)">Вперед →</button>
    </div>
</div>
