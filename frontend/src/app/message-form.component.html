<div class="message-form">
    <h3>Add New Message</h3>
    <form (ngSubmit)="onSubmit()">
        <div class="form-group">
            <input
                    type="text"
                    class="form-control"
                    [(ngModel)]="newMessage"
                    name="message"
                    placeholder="Enter your message"
                    required>
        </div>
        <button type="submit" class="btn btn-primary">Send Message</button>
    </form>
</div>
